name: Week 2 Quality Checks

on:
  push:
    branches: [main]
    paths:
      - "week-1/**"
      - "week-2/**"
      - ".github/workflows/week-2-ci.yml"
  pull_request:
    paths:
      - "week-1/**"
      - "week-2/**"
      - ".github/workflows/week-2-ci.yml"
  workflow_dispatch:

jobs:
  validate-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: week-1/requirements-dev.txt

      - name: Install development tools
        run: python -m pip install -r week-1/requirements-dev.txt

      - name: Validate cumulative source register
        working-directory: week-1
        run: python scripts/validate_source_register.py

      - name: Check official disease coverage
        run: python week-2/scripts/check_coverage.py

      - name: Lint Week 1 and Week 2 scripts
        run: ruff check --force-exclude --config week-1/pyproject.toml week-1 week-2/scripts week-2/datasets
