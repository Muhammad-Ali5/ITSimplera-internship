name: Week 1 quality checks

on:
  push:
    paths:
      - "week-1/**"
  pull_request:
    paths:
      - "week-1/**"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week-1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run source register validator
        run: python scripts/validate_source_register.py

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .
