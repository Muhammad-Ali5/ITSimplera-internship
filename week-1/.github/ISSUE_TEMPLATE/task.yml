name: Week 1 task
description: Track a focused Week 1 foundation or research task
title: "[Week 1] "
labels: ["week-1"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Task goal
      description: What needs to be completed?
      placeholder: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Add links, files, or source details that support the work.
    validations:
      required: false
  - type: textarea
    id: checks
    attributes:
      label: Validation
      description: Explain how the result will be checked.
    validations:
      required: true
